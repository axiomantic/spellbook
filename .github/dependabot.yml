version: 2
updates:
  # Python dependencies (pyproject.toml / uv.lock)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"

  # Docker (tests)
  - package-ecosystem: "docker"
    directory: "/tests/docker"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "ci"

  # Node - test suite
  - package-ecosystem: "npm"
    directory: "/tests/unit"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "tests"
