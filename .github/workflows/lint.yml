name: Lint

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  shellcheck:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Run shellcheck
      uses: ludeeus/action-shellcheck@master
      with:
        scandir: './tests'
        severity: warning

  markdown-lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Lint markdown files
      uses: articulate/actions-markdownlint@v1
      with:
        config: .markdownlint.json
        files: '**/*.md'
        ignore: node_modules

  schema-validation:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'

    - name: Install uv
      uses: astral-sh/setup-uv@v7

    - name: Install dependencies
      run: uv sync --all-extras --group dev

    - name: Validate skill, rule, agent, and command schemas
      run: uv run scripts/validate_schemas.py
