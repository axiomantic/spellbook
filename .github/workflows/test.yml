name: Test Spellbook

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  node-tests:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '20'

    - name: Install test dependencies
      run: |
        cd tests/unit
        npm install

    - name: Run unit tests
      run: |
        cd tests/unit
        npm test

  context-curator-tests:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '20'

    - name: Install test dependencies
      run: |
        cd extensions/opencode/context-curator
        npm install

    - name: Run context-curator tests
      run: |
        cd extensions/opencode/context-curator
        npm test

  shell-integration-tests:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Run integration tests
      run: |
        chmod +x tests/claude-code/*.sh
        tests/claude-code/run-all-tests.sh

  dedupe-skill-gates:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '20'

    - name: Install gate dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y jq perl
        npm install -g markdownlint-cli2

    # The gates fail loudly rather than skip when a tool is absent; a silent
    # skip was previously caught as a green mirage. Prove the tools resolve
    # here so a missing one fails at install time, not as a confusing gate error.
    - name: Verify gate dependencies resolve
      run: |
        jq --version
        perl -v
        markdownlint-cli2 --version > /dev/null

    - name: Run dedupe skill verification gates
      run: |
        chmod +x tests/dedupe-skill/*.sh
        tests/dedupe-skill/run-all-gates.sh

  python-tests:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
      fail-fast: false
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'

    - name: Install uv
      uses: astral-sh/setup-uv@v7

    - name: Install dependencies
      run: uv sync --all-extras --group dev

    - name: Run Python tests
      if: runner.os != 'Windows'
      run: uv run pytest tests/ -v --tb=short -m "not docker and not external" --override-ini="addopts="

    - name: Run Python tests (Windows)
      if: runner.os == 'Windows'
      run: uv run pytest tests/ -v --tb=short --ignore=tests/docker -m "not docker and not external" --override-ini="addopts="

    - name: Verify installer
      run: uv run python install.py --dry-run
