repos:
  - repo: https://github.com/thlorenz/doctoc
    rev: d713d623c0c0e80b3084ee2f09d4eb83aa7298e9
    hooks:
      - id: doctoc
        args: ['--github', '--minlevel', '2', '--maxlevel', '3']
        files: ^README\.md$

  - repo: local
    hooks:
      - id: generate-docs
        name: Generate documentation
        entry: uv run scripts/generate_docs.py
        language: system
        pass_filenames: false
        files: ^(skills/|commands/|agents/|rules/)

      - id: check-docs-completeness
        name: Check documentation completeness
        entry: python3 scripts/check-readme-completeness.py
        language: system
        pass_filenames: false
        always_run: true

      - id: validate-schemas
        name: Validate skill/command/agent/rule schemas
        entry: uv run scripts/validate_schemas.py
        language: system
        pass_filenames: false
        files: ^(skills/|commands/|agents/|rules/)

      - id: check-dependabot-coverage
        name: Check Dependabot covers all package manifests
        entry: uv run python scripts/check_dependabot_coverage.py
        language: system
        pass_filenames: false
        files: (package\.json|go\.mod|Dockerfile|pyproject\.toml|Cargo\.toml|dependabot\.yml)$
